[project]
name = "olympic-hosts"
version = "0.1.0"
description = "Does hosting the Games increase a nation's medal haul, and by how much?"
readme = "README.md"
authors = [
    { name = "Luke Acland", email = "205208481+LA-VS@users.noreply.github.com" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "duckdb>=2.0.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pandas>=3.1.1",
    "requests>=2.34.2",
    "scipy>=1.18.1",
    "seaborn>=0.13.2",
    "statsmodels>=0.15.0",
]

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "jupyter>=1.1.1",
    "nbconvert>=7.17.2",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-include = ["*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
"notebooks/*" = ["E501", "B007"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"